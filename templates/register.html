<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Create Account - HelpGenie</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>

<body>

<div class="auth-page">

    <div class="auth-card">

        <div class="logo">
            HelpGenie
        </div>

        <div class="logo-subtitle">
            AI-Powered IT Helpdesk Assistant
        </div>

        <h1>
            Create Account
        </h1>

        <p class="auth-description">
            Create your HelpGenie account.
        </p>

        {% with messages = get_flashed_messages(with_categories=true) %}

            {% if messages %}

                <div class="flash-container">

                    {% for category, message in messages %}

                        <div class="flash {{ category }}">
                            {{ message }}
                        </div>

                    {% endfor %}

                </div>

            {% endif %}

        {% endwith %}

        <form
            method="POST"
            action="{{ url_for('register') }}"
        >

            <div class="form-group">

                <label for="name">
                    Full Name
                </label>

                <input
                    type="email"
                    id="name"
                    name="name"
                    class="form-input"
                    placeholder="Enter your full name"
                    required
                >

            </div>

            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    class="form-input"
                    placeholder="Enter your email"
                    required
                >

            </div>

            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    class="form-input"
                    placeholder="Minimum 6 characters"
                    minlength="6"
                    required
                >

            </div>

            <div class="form-group">

                <label for="confirm_password">
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="confirm_password"
                    name="confirm_password"
                    class="form-input"
                    placeholder="Re-enter password"
                    minlength="6"
                    required
                >

            </div>

            <button
                type="submit"
                class="primary-btn"
            >
                Create Account
            </button>

        </form>

        <div class="auth-footer">

            Already have an account?

            <a href="{{ url_for('login') }}">
                Login
            </a>

        </div>

    </div>

</div>

</body>
</html>
